<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1a4e">
<meta property="og:title" content="welcome to blissify 🎉">
<meta property="og:description" content="Answer 5 quick questions and unlock a surprise.">
<title>welcome to blissify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ef4242;--yellow:#ffc70a;--navy:#1f1a4e;--bg:#1f1a4e;--card:#2a2563;--line:#4a4496;--green:#2ecc71;--text:#fff;--muted:#c9c6e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
 background:radial-gradient(600px 400px at 100% 0,rgba(239,66,66,.18),transparent 70%),radial-gradient(500px 400px at 0 100%,rgba(255,199,10,.12),transparent 70%),var(--bg);background-attachment:fixed;
 display:flex;justify-content:center;
 padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:block;height:clamp(30px,8vw,40px);width:auto}
.count{font-size:13px;font-weight:700;color:var(--navy);background:var(--yellow);padding:5px 12px;border-radius:999px;letter-spacing:.5px;opacity:0;transition:opacity .3s}
.count.on{opacity:1}
.bar{height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--yellow));border-radius:8px;transition:width .45s ease}
.card{background:var(--card);border-radius:22px;padding:clamp(22px,5vw,32px) clamp(18px,5vw,30px);box-shadow:0 20px 50px rgba(0,0,0,.25);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2{margin:0 0 12px;line-height:1.25;font-weight:700}
h1{font-size:clamp(24px,6.5vw,30px)}
h2{font-size:clamp(19px,5vw,22px)}
.tlogo{height:1.05em;width:auto;vertical-align:-.12em;margin:0 .08em}
p{color:var(--muted);line-height:1.6;margin:0 0 22px;font-size:clamp(14px,3.8vw,16px)}
.step{color:var(--yellow);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
button{font:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
.opts{margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;background:transparent;color:var(--text);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(255,255,255,.08)}
@media (hover:hover){.opt:hover{border-color:var(--yellow)}.opt.ok:hover{border-color:var(--green)}.opt.no:hover{border-color:var(--red)}}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.opt.no{background:var(--red);border-color:var(--red);font-weight:600}
.opt.ok .k,.opt.no .k{background:rgba(255,255,255,.25)}
.opt[disabled]{cursor:default}
.fb{margin:6px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.06);font-size:14px}
.cta{background:var(--red);color:#fff;font-weight:700;padding:15px 30px;border-radius:999px;font-size:16px;min-height:52px;box-shadow:0 8px 20px rgba(239,66,66,.35);transition:filter .15s,transform .1s,opacity .2s}
.cta:active:not(:disabled){transform:scale(.97)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
@media (hover:hover){.cta:hover:not(:disabled){filter:brightness(1.1)}}
.row{display:flex;justify-content:flex-end;align-items:center;margin-top:18px}
/* gift */
.gift{text-align:center}
.gift p{margin-bottom:6px}
.stage{position:relative;height:210px;display:grid;place-items:center;margin:10px 0 4px}
.halo{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,199,10,.35),transparent 65%);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.box{position:relative;width:150px;height:150px;cursor:pointer;animation:hop 1.8s ease-in-out infinite;outline:none}
.box:focus-visible{outline:3px solid var(--yellow);outline-offset:8px;border-radius:12px}
.shadow{position:absolute;left:18px;right:18px;bottom:-14px;height:14px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(4px)}
.base{position:absolute;bottom:0;left:12px;right:12px;height:96px;background:linear-gradient(180deg,#d63636 0,var(--red) 18%);border-radius:4px 4px 14px 14px;overflow:hidden}
.base:before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:22px;background:var(--yellow)}
.lid{position:absolute;top:30px;left:0;right:0;height:38px;background:var(--red);border-radius:10px;box-shadow:inset 0 -5px 0 #c93030,0 4px 8px rgba(0,0,0,.2);z-index:2;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .6s .15s}
.lid:before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:22px;background:var(--yellow)}
.bow{position:absolute;left:50%;top:3px;width:0;height:0}
.bow i{position:absolute;bottom:0;width:34px;height:26px;border:7px solid var(--yellow);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.bow i:first-child{right:2px;transform:rotate(-22deg);transform-origin:right bottom}
.bow i:last-child{left:2px;transform:rotate(22deg);transform-origin:left bottom}
.bow b{position:absolute;left:-8px;bottom:-6px;width:16px;height:14px;border-radius:5px;background:#f0b800}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-6px) rotate(-5deg)}40%{transform:translateY(0) rotate(4deg)}60%{transform:translateY(-3px) rotate(-2deg)}80%{transform:translateY(0) rotate(0)}}
.box.open{animation:pop .45s ease;cursor:default}
.box.open .lid{transform:translate(70px,-150px) rotate(40deg);opacity:0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12,.9)}100%{transform:scale(1)}}
.hint{font-size:13px;font-weight:600;color:var(--yellow);letter-spacing:.5px;margin-top:6px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.opened .hint,.opened .sub{display:none}
.opened .stage{height:150px}
.opened .halo{animation:none;opacity:.8;transform:scale(.85)}
.box.open .base{box-shadow:inset 0 10px 0 #a82424}
.prize{display:none;background:var(--yellow);color:var(--navy);border-radius:18px;padding:22px 20px;margin-top:12px;box-shadow:0 14px 30px rgba(255,199,10,.25)}
.prize.show{display:block;animation:reveal .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes reveal{from{opacity:0;transform:translateY(20px) scale(.92)}to{opacity:1;transform:none}}
.prize b{font-size:clamp(20px,5.5vw,24px);display:block;margin-bottom:8px;font-weight:800}
.prize p{color:var(--navy);margin:0;font-weight:500}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
@media (max-width:480px){
 header{margin-bottom:14px}.bar{margin-bottom:18px}
 .card{border-radius:18px}
 .row .cta,.card>.cta{width:100%}
 .opt{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* ===== EDIT ME: your questions and gift ===== */
const WELCOME={title:"welcome to {logo} 🎉",text:"Let's see how well you know our values and our academy. Answer 5 quick questions, and a tasty surprise waits at the end."};
const QUESTIONS=[
 {q:"Which of these is NOT a blissify value?",o:["Wellbeing","Ownership","Competition","Fun"],a:2,e:"Our values: wellbeing, innovation, ownership, accountable and fun."},
 {q:"Which of these is NOT a blissify value?",o:["Innovation","Accountable","Perfection","Wellbeing"],a:2,e:"Perfection isn't one of ours. We value innovation, accountable and wellbeing."},
 {q:"How many core values does blissify have?",o:["3","4","5","6"],a:2,e:"Five: wellbeing, innovation, ownership, accountable and fun."},
 {q:"Which of these is NOT a blissify academy course?",o:["Analytics","AI","Soft skills","Journey"],a:2,e:"The academy offers analytics, AI, journey and advanced. Soft skills isn't one of them."},
 {q:"Which of these IS a blissify academy course?",o:["Photography","Advanced","Cooking","Soft skills"],a:1,e:"Advanced is part of the blissify academy."}
];
const GIFT={title:"It's a pizza day! 🍕",text:"The team is treating you to pizza. Show this screen to your team lead to claim your slice."};
/* ============================================ */
const app=document.getElementById("app"),bar=document.getElementById("bar"),count=document.getElementById("count");
const L="ABCD";
let i=-1,ans=[];
function setBar(){
 bar.style.width=Math.max(0,Math.min(i,QUESTIONS.length))/QUESTIONS.length*100+"%";
 const q=i>=0&&i<QUESTIONS.length;count.classList.toggle("on",q);if(q)count.textContent=(i+1)+" / "+QUESTIONS.length;
}
function render(){
 setBar();window.scrollTo({top:0,behavior:"smooth"});
 if(i<0){app.innerHTML=`<div class="card"><h1>${WELCOME.title.replace("{logo}",`<img class="tlogo" alt="blissify" src="${document.getElementById("logo").src}">`)}</h1><p>${WELCOME.text}</p><button class="cta" id="go">Let's start</button></div>`;
  document.getElementById("go").onclick=()=>{i=0;render()};return}
 if(i>=QUESTIONS.length){gift();return}
 const Q=QUESTIONS[i],done=ans[i]!==undefined;
 app.innerHTML=`<div class="card"><div class="step">Question ${i+1} of ${QUESTIONS.length}</div><h2>${Q.q}</h2><div class="opts">`+
  Q.o.map((o,k)=>`<button class="opt${done&&k===Q.a?" ok":""}${done&&ans[i]===k&&k!==Q.a?" no":""}" data-k="${k}"${done?" disabled":""}><span class="k">${L[k]}</span><span>${o}</span></button>`).join("")+
  `</div>`+(done?`<p class="fb">${ans[i]===Q.a?"✅ Correct! ":"❌ Not quite. "}${Q.e}</p>`:"")+
  `<div class="row"><button class="cta" id="nx" ${done?"":"disabled"}>${i==QUESTIONS.length-1?"Finish":"Next"}</button></div></div>`;
 if(!done)app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;render()});
 document.getElementById("nx").onclick=()=>{i++;render()};
}
function gift(){
 setBar();
 const sc=ans.filter((v,k)=>v===QUESTIONS[k].a).length;
 app.innerHTML=`<div class="card gift" id="g"><h2>You scored ${sc}/${QUESTIONS.length}. Your gift is ready 🎁</h2><p class="sub">Tap the box to open it.</p>
 <div class="stage"><div class="halo"></div>
  <div class="box" id="box" role="button" tabindex="0" aria-label="Open your gift">
   <div class="shadow"></div><div class="base"></div>
   <div class="lid"><div class="bow"><i></i><i></i><b></b></div></div>
  </div></div>
 <div class="hint">TAP TO OPEN</div>
 <div class="prize" id="prize"><b>${GIFT.title}</b><p>${GIFT.text}</p></div></div>`;
 const box=document.getElementById("box");
 const open=()=>{if(box.classList.contains("open"))return;box.classList.add("open");document.getElementById("g").classList.add("opened");
  const pr=document.getElementById("prize");pr.classList.add("show");confetti();
  setTimeout(()=>pr.scrollIntoView({behavior:"smooth",block:"nearest"}),300)};
 box.onclick=open;box.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};
}
function confetti(){
 const c=["#ef4242","#ffc70a","#ffffff"];
 for(let n=0;n<80;n++){const d=document.createElement("div");d.className="conf";
  d.style.left=Math.random()*100+"vw";d.style.background=c[n%3];
  d.style.animationDuration=(2+Math.random()*2)+"s";d.style.animationDelay=Math.random()*.5+"s";
  document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
}
render();
</script>
</body>
</html>
